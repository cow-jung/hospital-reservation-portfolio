{% extends "base.html" %}{% block title %}회원가입{% endblock %}
{% block content %}<div class="auth-shell"><div class="auth-card"><h2>회원가입</h2><p class="auth-subtitle">회원 정보를 입력해 병원 예약 서비스를 시작하세요.</p>
<form method="post" action="{{ url_for('auth.signup') }}">
<label for="username">아이디 *</label><div class="field-with-action"><input type="text" id="username" name="username" required placeholder="사용할 아이디"><button type="button" onclick="checkUsername()">중복확인</button></div><p id="username-check-result" class="form-guide">아이디 중복확인을 진행해주세요.</p>
<label for="password">비밀번호 *</label><input type="password" id="password" name="password" required placeholder="비밀번호"><p class="form-guide">8자 이상, 영문자·숫자·특수문자를 각각 1개 이상 포함해주세요.</p>
<label for="password_confirm">비밀번호 확인 *</label><input type="password" id="password_confirm" name="password_confirm" required placeholder="비밀번호를 다시 입력하세요">
<label for="name">이름 *</label><input type="text" id="name" name="name" required placeholder="이름">
<label for="phone">전화번호</label><input type="text" id="phone" name="phone" placeholder="01012345678"><p class="form-guide">'-' 없이 숫자만 입력해주세요.</p>
<label for="email">이메일</label><input type="email" id="email" name="email" placeholder="example@email.com"><button type="submit">회원가입</button></form>
<p class="auth-footer">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p></div></div>
<script>function checkUsername(){const u=document.getElementById("username").value.trim(),r=document.getElementById("username-check-result");if(!u){r.textContent="아이디를 입력하세요.";r.style.color="#dc2626";return;}fetch("{{ url_for('auth.check_username') }}?username="+encodeURIComponent(u)).then(x=>x.json()).then(d=>{r.textContent=d.available?"사용 가능한 아이디입니다.":"이미 사용 중인 아이디입니다.";r.style.color=d.available?"#15803d":"#dc2626";});}</script></div>{% endblock %}
