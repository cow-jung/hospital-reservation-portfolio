{% extends "base.html" %}{% block title %}문의 작성{% endblock %}{% block content %}
<div class="page-shell"><div class="page-heading"><h2>문의 작성</h2><p>진료 또는 병원 이용에 관한 문의 내용을 작성해주세요.</p></div>
<form class="content-form" action="{{ url_for('board.board_write') }}" method="post"><label>제목</label><input type="text" name="title" placeholder="게시글 제목을 입력하세요" required><label class="check-label"><input type="checkbox" name="is_secret" value="1"> 비밀글로 작성하기 <small>관리자와 작성자만 확인할 수 있습니다.</small></label><label>내용</label><textarea name="content" rows="12" placeholder="문의하실 내용을 자세히 적어주세요." required></textarea><div class="form-actions"><a class="secondary-btn" href="{{ url_for('board.board') }}">취소</a><button type="submit">등록하기</button></div></form></div>{% endblock %}
