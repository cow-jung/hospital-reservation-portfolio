{% extends "base.html" %}{% block title %}문의 수정{% endblock %}{% block content %}
<div class="page-shell"><div class="page-heading"><h2>문의 수정</h2><p>작성한 문의 내용을 수정합니다.</p></div>
<form class="content-form" action="{{ url_for('board.board_edit', board_id=post.board_id) }}" method="post"><label>제목</label><input type="text" name="title" value="{{ post.title }}" required><label class="check-label"><input type="checkbox" name="is_secret" value="1" {% if post.is_secret %}checked{% endif %}> 비밀글로 작성하기 <small>관리자와 작성자만 확인할 수 있습니다.</small></label><label>내용</label><textarea name="content" rows="12" required>{{ post.content }}</textarea><div class="form-actions"><a class="secondary-btn" href="{{ url_for('board.board_view', board_id=post.board_id) }}">취소</a><button type="submit">수정 완료</button></div></form></div>{% endblock %}
