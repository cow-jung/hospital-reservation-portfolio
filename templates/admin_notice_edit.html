{% extends "admin_base.html" %}
{% block title %}{{ notice.title }} 수정{% endblock %}

{% block content %}
<h2>공지사항 수정 - {{ notice.title }}</h2>

<p><a href="{{ url_for('admin.admin_notice_detail', notice_id=notice.notice_id) }}">&larr; 상세로 돌아가기</a></p>

<form method="post" action="{{ url_for('admin.admin_notice_edit', notice_id=notice.notice_id) }}">
    <div>
        <label for="title">제목</label>
        <input type="text" id="title" name="title" value="{{ notice.title }}" required>
    </div>
    <br>

    <div>
        <label for="content">내용</label><br>
        <textarea id="content" name="content" rows="8" cols="60" required>{{ notice.content }}</textarea>
    </div>
    <br>

    <div>
        <label>구분</label><br>
        <label class="notice-radio-label">
            <input type="radio" name="notice_type" value="일반" {% if notice.notice_type == '일반' %}checked{% endif %}>
            일반
        </label>
        <label class="notice-radio-label">
            <input type="radio" name="notice_type" value="긴급" {% if notice.notice_type == '긴급' %}checked{% endif %}>
            긴급
        </label>
    </div>
    <br>

    <button type="submit">수정 저장</button>
</form>
{% endblock %}
