<!-- base.html의 뼈대를 가져와서 사용합니다 -->
{% extends "base.html" %}

{% block content %}
<!-- 나중에 디자인할 때 이 줄만 삭제하면 됩니다! -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/temp_board.css') }}">

<div class="board-container">
    <h2>게시글 수정</h2>

    <!-- 수정 완료 시 1단계에서 만든 /board/edit/게시글번호 로 폼 데이터를 전송합니다 -->
    <form action="/board/edit/{{ post.board_id }}" method="POST">
        <table>
            <tr>
                <th>제목</th>
                <!-- value 속성에 기존 제목({{ post.title }})을 넣어둡니다 -->
                <td><input type="text" name="title" value="{{ post.title }}" required class="form-input"></td>
            </tr>
            <tr>
                <th>옵션</th>
                <td>
                    <label class="pointer-label">
                        <!-- 기존 글이 비밀글(is_secret == 1)이었다면 체크된 상태(checked)로 보여줍니다 -->
                        <input type="checkbox" name="is_secret" value="1" {% if post.is_secret %}checked{% endif %}> 관리자와 작성자만 볼 수 있도록 비밀글로 설정합니다.
                    </label>
                </td>
            </tr>
            <tr>
                <th>내용</th>
                <!-- textarea는 value 속성 대신 태그 사이에 기존 내용({{ post.content }})을 넣습니다 -->
                <td><textarea name="content" rows="10" required class="form-input">{{ post.content }}</textarea></td>
            </tr>
        </table>

        <br>
        <div class="center-align">
            <button type="submit">수정 완료</button>
            <!-- 취소 버튼을 누르면 다시 상세 보기 화면으로 돌아갑니다 -->
            <a href="/board/view/{{ post.board_id }}" class="btn-link-spacing">
                <button type="button">취소</button>
            </a>
        </div>
    </form>
</div>
{% endblock %}
