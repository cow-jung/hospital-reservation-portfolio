{% extends "base.html" %}{% block title %}로그인{% endblock %}
{% block content %}<div class="auth-shell"><div class="auth-card"><h2>로그인</h2><p class="auth-subtitle">예약과 진료 내역을 편리하게 관리하세요.</p>
<form method="post" action="{{ url_for('auth.login') }}"><label for="username">아이디</label><input type="text" id="username" name="username" required autocomplete="username" placeholder="아이디를 입력하세요"><label for="password">비밀번호</label><input type="password" id="password" name="password" required autocomplete="current-password" placeholder="비밀번호를 입력하세요"><button type="submit">로그인</button></form>
<p class="auth-footer">계정이 없으신가요? <a href="{{ url_for('auth.signup') }}">회원가입</a></p></div></div>{% endblock %}
