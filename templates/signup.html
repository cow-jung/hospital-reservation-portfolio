{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}

<h2>회원가입</h2>

<form method="post" action="{{ url_for('auth.signup') }}">

    <!-- 아이디 -->
    <p>
        <label for="username">
            아이디 <span style="color:red;">*</span>
        </label>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <button
            type="button"
            onclick="checkUsername()"
        >
            중복확인
        </button>
    </p>

    <p id="username-check-result"></p>


    <!-- 비밀번호 -->
    <p>
        <label for="password">
            비밀번호 <span style="color:red;">*</span>
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </p>

    <p style="font-size: 13px; color: #666;">
        ※ 비밀번호는 8자 이상이며,
        영문자, 숫자, 특수문자를 각각 1개 이상 포함해야 합니다.
    </p>


    <!-- 비밀번호 확인 -->
    <p>
        <label for="password_confirm">
            비밀번호 확인 <span style="color:red;">*</span>
        </label>

        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            required
        >
    </p>


    <!-- 이름 -->
    <p>
        <label for="name">
            이름 <span style="color:red;">*</span>
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >
    </p>


    <!-- 전화번호 -->
    <p>
        <label for="phone">
            전화번호
        </label>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="01012345678"
        >
    </p>

    <p style="font-size: 13px; color: #666;">
        ※ 전화번호는 '-' 없이 숫자만 입력해 주세요.
    </p>


    <!-- 이메일 -->
    <p>
        <label for="email">
            이메일
        </label>

        <input
            type="email"
            id="email"
            name="email"
        >
    </p>


    <button type="submit">
        회원가입
    </button>

</form>


<script>
function checkUsername() {

    const username = document
        .getElementById("username")
        .value
        .trim();

    const result = document
        .getElementById("username-check-result");

    if (username === "") {
        result.textContent = "아이디를 입력하세요.";
        result.style.color = "red";
        return;
    }

    fetch(
        "{{ url_for('auth.check_username') }}?username="
        + encodeURIComponent(username)
    )
    .then(response => response.json())
    .then(data => {

        if (data.available) {
            result.textContent = "사용 가능한 아이디입니다.";
            result.style.color = "green";
        } else {
            result.textContent = "이미 사용 중인 아이디입니다.";
            result.style.color = "red";
        }

    });
}
</script>

{% endblock %}
